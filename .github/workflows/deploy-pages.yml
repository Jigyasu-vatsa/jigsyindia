name: Deploy JIGSY INDIA Official Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine GitHub Pages base path
        id: basepath
        run: |
          if [ -f "public/CNAME" ] || [ -f "CNAME" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_PAGES="${GITHUB_REPOSITORY_OWNER}.github.io"
            if [ "${REPO_NAME,,}" = "${OWNER_PAGES,,}" ]; then
              echo "base=/" >> "$GITHUB_OUTPUT"
            else
              echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build production portal
        env:
          VITE_BASE_PATH: ${{ steps.basepath.outputs.base }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
