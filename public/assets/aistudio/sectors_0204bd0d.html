{% extends "base.html" %}
{% block content %}
<h2>All Sectors</h2>
<div class="row g-3">
  {% for s in sectors %}
  <div class="col-md-4">
    <div class="card h-100 bg-body">
      <img src="{{ s.logo }}" class="card-img-top" alt="{{ s.name }}" style="max-height:160px;object-fit:cover;">
      <div class="card-body">
        <h5>{{ s.name }}</h5>
        <p class="text-muted">{{ s.motto }}</p>
        <div class="d-grid">
          {% if s.is_active %}
            <a class="btn btn-primary" href="{{ url_for('public.sector_detail', slug=s.slug) }}">Visit</a>
          {% else %}
            <a class="btn btn-outline-secondary" data-comingsoon="{{ s.name }}">Coming Soon</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
