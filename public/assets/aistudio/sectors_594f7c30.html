{% extends "sector_base.html" %}
{% block sector_content %}
<h2 class="mt-4 text-body">All Sectors</h2>
<div class="row g-3 my-3">
  {% for s in sectors %}
  <div class="col-md-4">
    <div class="card h-100 bg-body">
      <img src="{{ url_for('static', filename=s.logo or 'img/sectors/comingsoon.png') }}" class="card-img-top" style="height: 200px; object-fit: fill; border-bottom: 1px solid #dee2e6;">
      <div class="card-body">
        <h5>{{ s.name }}</h5>
        <p class="text-muted">{{ s.motto }}</p>
        <div class="d-grid">
          {% if s.is_active %}
            <a class="btn btn-primary" href="{{ url_for('public.sector_detail', slug=s.slug) }}">Visit</a>
          {% else %}
            <a class="btn btn-outline-secondary" data-comingsoon="{{ s.name }}">Coming Soon</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
